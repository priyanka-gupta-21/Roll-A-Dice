<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll the Dice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1476af, #0fa0da);
    }

    .game {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    .dice {
      width: 120px;
      height: 120px;
      margin: 20px auto 30px;
      background: #ff4757;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
      color: white;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    button {
      border: none;
      padding: 14px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #2ed573;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #20bf6b;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #444;
    }

    .rolling {
      animation: roll 0.5s ease-in-out;
    }

    @keyframes roll {
      0% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(90deg);
      }
      50% {
        transform: rotate(180deg);
      }
      75% {
        transform: rotate(270deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🎲 Roll the Dice</h1>

    <div class="dice" id="dice">⚀</div>

    <button onclick="rollDice()">Roll Dice</button>

    <div id="result">Click the button to roll!</div>
  </div>

  <script>
    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
      const dice = document.getElementById("dice");
      const result = document.getElementById("result");

      dice.classList.remove("rolling");

      // Restart animation
      void dice.offsetWidth;
      dice.classList.add("rolling");

      // Generate random number from 1 to 6
      const number = Math.floor(Math.random() * 6) + 1;

      setTimeout(() => {
        dice.textContent = diceFaces[number - 1];
        result.textContent = `You rolled a ${number}! 🎉`;
      }, 500);
    }
  </script>

</body>
</html>
